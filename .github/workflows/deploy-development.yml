name: Deploy development environment

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: aws-cost-optimizer-development-deployment
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-1
  STACK_NAME: aws-cost-optimizer-dev

jobs:
  deploy:
    name: Deploy development stack
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: development

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: aws-actions/setup-sam@v2

      - name: Configure temporary AWS credentials through OIDC
        uses: aws-actions/configure-aws-credentials@v6.1.2
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          role-session-name: aws-cost-optimizer-${{ github.run_id }}

      - name: Validate infrastructure
        run: sam validate --lint --template infrastructure/template.yaml

      - name: Build Lambda artifacts in Linux containers
        run: sam build --template-file infrastructure/template.yaml --use-container

      - name: Deploy safe development configuration
        run: >-
          sam deploy
          --template-file .aws-sam/build/template.yaml
          --stack-name "$STACK_NAME"
          --region "$AWS_REGION"
          --s3-bucket "${{ vars.AWS_SAM_ARTIFACT_BUCKET }}"
          --s3-prefix "aws-cost-optimizer/${{ github.sha }}"
          --capabilities CAPABILITY_IAM
          --parameter-overrides
          Environment=dev
          ScheduledScansEnabled=false
          CleanupDryRun=true
          CleanupExecutionEnabled=false
          --no-confirm-changeset
          --no-fail-on-empty-changeset

      - name: Read deployed frontend configuration
        id: stack_outputs
        shell: bash
        run: |
          set -euo pipefail

          stack_output() {
            aws cloudformation describe-stacks \
              --stack-name "$STACK_NAME" \
              --region "$AWS_REGION" \
              --query "Stacks[0].Outputs[?OutputKey=='$1'].OutputValue | [0]" \
              --output text
          }

          echo "api_endpoint=$(stack_output ApiEndpoint)" >> "$GITHUB_OUTPUT"
          echo "cognito_issuer=$(stack_output CognitoIssuer)" >> "$GITHUB_OUTPUT"
          echo "cognito_domain=$(stack_output CognitoDomain)" >> "$GITHUB_OUTPUT"
          echo "cognito_client_id=$(stack_output DashboardCognitoClientId)" >> "$GITHUB_OUTPUT"
          echo "dashboard_bucket=$(stack_output DashboardBucketName)" >> "$GITHUB_OUTPUT"
          echo "distribution_id=$(stack_output DashboardDistributionId)" >> "$GITHUB_OUTPUT"
          echo "dashboard_url=$(stack_output DashboardUrl)" >> "$GITHUB_OUTPUT"

      - name: Build dashboard with deployed public configuration
        working-directory: frontend
        env:
          VITE_API_BASE_URL: ${{ steps.stack_outputs.outputs.api_endpoint }}
          VITE_COGNITO_ISSUER: ${{ steps.stack_outputs.outputs.cognito_issuer }}
          VITE_COGNITO_DOMAIN: ${{ steps.stack_outputs.outputs.cognito_domain }}
          VITE_COGNITO_CLIENT_ID: ${{ steps.stack_outputs.outputs.cognito_client_id }}
        run: |
          npm ci
          npm run build

      - name: Publish dashboard assets to the private origin bucket
        env:
          DASHBOARD_BUCKET: ${{ steps.stack_outputs.outputs.dashboard_bucket }}
        run: |
          set -euo pipefail
          aws s3 sync frontend/dist "s3://${DASHBOARD_BUCKET}" \
            --delete \
            --exclude "index.html" \
            --cache-control "public, max-age=31536000, immutable" \
            --no-progress
          aws s3 cp frontend/dist/index.html "s3://${DASHBOARD_BUCKET}/index.html" \
            --cache-control "no-cache, no-store, must-revalidate" \
            --content-type "text/html; charset=utf-8" \
            --no-progress

      - name: Invalidate cached dashboard assets
        env:
          DISTRIBUTION_ID: ${{ steps.stack_outputs.outputs.distribution_id }}
          DASHBOARD_URL: ${{ steps.stack_outputs.outputs.dashboard_url }}
        run: |
          set -euo pipefail
          aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" --paths "/*"
          echo "Dashboard deployed to ${DASHBOARD_URL}"
