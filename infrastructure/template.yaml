AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Deployable foundation for the AWS Cost Optimization Automation System.

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - staging
      - prod
    Description: Deployment environment name.
  DashboardOrigin:
    Type: String
    AllowedPattern: "^https://[a-z0-9]([a-z0-9-]*[a-z0-9])?\\.vercel\\.app$"
    ConstraintDescription: Provide the exact HTTPS Vercel production origin without a trailing slash.
    Description: Exact Vercel production origin allowed for the Cognito browser client and API Gateway CORS.
  ScheduledScansEnabled:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: Enable the EventBridge schedule for automatic read-only scans.
  ScanScheduleExpression:
    Type: String
    Default: "cron(0 3 ? * SUN *)"
    Description: EventBridge schedule expression for automatic read-only scans (UTC).
  NotificationEmail:
    Type: String
    Default: ""
    Description: Optional email address for SNS finding notifications. The recipient must confirm the subscription.
  OperationalAlertEmail:
    Type: String
    Default: ""
    Description: Optional email address for operational alarm notifications. The recipient must confirm the subscription.
  CleanupDryRun:
    Type: String
    Default: "true"
    AllowedValues:
      - "true"
      - "false"
    Description: Keep cleanup simulation-only unless deliberately disabled with cleanup execution enabled.
  CleanupExecutionEnabled:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: Explicitly allow the isolated cleanup Lambda to delete revalidated EBS volumes.
  UtilizationLookbackDays:
    Type: Number
    Default: 14
    MinValue: 1
    MaxValue: 90
    Description: Number of complete UTC days required for utilization recommendations.
  Ec2MaximumCpuPercent:
    Type: Number
    Default: 5
    MinValue: 0
    MaxValue: 100
    Description: Maximum daily EC2 CPU utilization allowed by the recommendation rule.
  Ec2MaximumTotalNetworkBytes:
    Type: Number
    Default: 1073741824
    MinValue: 0
    Description: Maximum total EC2 NetworkIn plus NetworkOut bytes across the lookback window.
  RdsMaximumCpuPercent:
    Type: Number
    Default: 5
    MinValue: 0
    MaxValue: 100
    Description: Maximum daily RDS CPU utilization allowed by the recommendation rule.

Conditions:
  ScheduledScansEnabledCondition: !Equals [!Ref ScheduledScansEnabled, "true"]
  NotificationEmailConfigured: !Not [!Equals [!Ref NotificationEmail, ""]]
  OperationalAlertEmailConfigured: !Not [!Equals [!Ref OperationalAlertEmail, ""]]

Resources:
  FindingsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "aws-cost-optimizer-findings-${Environment}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: finding_id
          AttributeType: S
        - AttributeName: status
          AttributeType: S
        - AttributeName: last_detected_at
          AttributeType: S
      KeySchema:
        - AttributeName: finding_id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: FindingsByStatusLastDetectedAtIndex
          KeySchema:
            - AttributeName: status
              KeyType: HASH
            - AttributeName: last_detected_at
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true

  ScanRunsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "aws-cost-optimizer-scan-runs-${Environment}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: scan_id
          AttributeType: S
        - AttributeName: dashboard_partition
          AttributeType: S
        - AttributeName: started_at
          AttributeType: S
      KeySchema:
        - AttributeName: scan_id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: ScanRunsByStartedAtIndex
          KeySchema:
            - AttributeName: dashboard_partition
              KeyType: HASH
            - AttributeName: started_at
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true

  AuditEventsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "aws-cost-optimizer-audit-events-${Environment}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: finding_id
          AttributeType: S
        - AttributeName: event_id
          AttributeType: S
      KeySchema:
        - AttributeName: finding_id
          KeyType: HASH
        - AttributeName: event_id
          KeyType: RANGE
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true

  ApiUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub "aws-cost-optimizer-operators-${Environment}"
      UsernameConfiguration:
        CaseSensitive: false
      AutoVerifiedAttributes:
        - email
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
      # Do not enable SMS MFA implicitly. This self-hosted dashboard has no
      # phone-number collection or SMS configuration, and public signup is
      # disabled. Add a reviewed TOTP-based MFA configuration in a future
      # identity-hardening change rather than introducing SMS cost and PII.
      MfaConfiguration: "OFF"
      Policies:
        PasswordPolicy:
          MinimumLength: 14
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true
          RequireUppercase: true
          TemporaryPasswordValidityDays: 3

  ApiUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub "aws-cost-optimizer-dashboard-${Environment}"
      UserPoolId: !Ref ApiUserPool
      GenerateSecret: false
      EnableTokenRevocation: true
      PreventUserExistenceErrors: ENABLED
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows:
        - code
      AllowedOAuthScopes:
        - openid
        - email
      CallbackURLs:
        - !Sub "${DashboardOrigin}/auth/callback"
        - http://localhost:5173/auth/callback
      LogoutURLs:
        - !Sub "${DashboardOrigin}/"
        - http://localhost:5173/
      SupportedIdentityProviders:
        - COGNITO
      ExplicitAuthFlows:
        - ALLOW_REFRESH_TOKEN_AUTH
      AccessTokenValidity: 60
      IdTokenValidity: 60
      TokenValidityUnits:
        AccessToken: minutes
        IdToken: minutes

  ApiUserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Sub "cost-optimizer-${Environment}-${AWS::AccountId}"
      UserPoolId: !Ref ApiUserPool

  ApiOperatorsGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: cost-optimizer-operators
      Description: Operators allowed to approve findings and request EBS cleanup.
      UserPoolId: !Ref ApiUserPool

  ApiAccessLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/apigateway/aws-cost-optimizer-${Environment}"
      RetentionInDays: 30

  CostOptimizationHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: "$default"
      DefinitionBody:
        openapi: 3.0.1
        info:
          title: AWS Cost Optimizer API
          version: "1.0"
        paths: {}
      CorsConfiguration:
        AllowHeaders:
          - authorization
          - content-type
        AllowMethods:
          - GET
          - POST
          - OPTIONS
        AllowOrigins:
          - !Ref DashboardOrigin
          - http://localhost:5173
        MaxAge: 600
      AccessLogSettings:
        DestinationArn: !GetAtt ApiAccessLogGroup.Arn
        Format: >-
          {"requestId":"$context.requestId","ip":"$context.identity.sourceIp","requestTime":"$context.requestTime","httpMethod":"$context.httpMethod","routeKey":"$context.routeKey","status":"$context.status","responseLength":"$context.responseLength","integrationError":"$context.integrationErrorMessage"}
      Auth:
        DefaultAuthorizer: CognitoJwtAuthorizer
        Authorizers:
          CognitoJwtAuthorizer:
            IdentitySource: "$request.header.Authorization"
            JwtConfiguration:
              audience:
                - !Ref ApiUserPoolClient
              issuer: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${ApiUserPool}"

  ApiFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      FunctionName: !Sub "aws-cost-optimizer-api-${Environment}"
      CodeUri: ../backend/
      Handler: cost_optimization.workers.api.handler
      Runtime: python3.13
      Architectures:
        - arm64
      MemorySize: 512
      Timeout: 30
      Tracing: Active
      Environment:
        Variables:
          COST_OPTIMIZER_ENVIRONMENT: !Ref Environment
          COST_OPTIMIZER_SERVICE_NAME: cost-optimization-api
          COST_OPTIMIZER_FINDINGS_TABLE_NAME: !Ref FindingsTable
          COST_OPTIMIZER_SCAN_RUNS_TABLE_NAME: !Ref ScanRunsTable
          COST_OPTIMIZER_AUDIT_EVENTS_TABLE_NAME: !Ref AuditEventsTable
          COST_OPTIMIZER_OPERATOR_IDENTITY_SOURCE: api_gateway_jwt
          COST_OPTIMIZER_REQUIRED_OPERATOR_GROUP: !Ref ApiOperatorsGroup
      Policies:
        - Statement:
            - Sid: ReadFindingsForDashboardAndWorkflowRequests
              Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:Query
              Resource:
                - !GetAtt FindingsTable.Arn
                - !Sub "${FindingsTable.Arn}/index/*"
                - !GetAtt ScanRunsTable.Arn
                - !Sub "${ScanRunsTable.Arn}/index/*"
            - Sid: ApproveFindingsWithAuditTrail
              Effect: Allow
              Action:
                - dynamodb:TransactWriteItems
              Resource:
                - !GetAtt FindingsTable.Arn
                - !GetAtt AuditEventsTable.Arn
            - Sid: PublishExplicitCleanupRequests
              Effect: Allow
              Action:
                - events:PutEvents
              Resource: !Sub "arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:event-bus/default"
      Events:
        AuthenticatedApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref CostOptimizationHttpApi
            Path: /{proxy+}
            Method: ANY
            PayloadFormatVersion: "2.0"

  ApiFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ApiFunction}"
      RetentionInDays: 30

  EbsScannerFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      FunctionName: !Sub "aws-cost-optimizer-ebs-scanner-${Environment}"
      CodeUri: ../backend/
      Handler: cost_optimization.workers.ebs_scanner.handler
      Runtime: python3.13
      Architectures:
        - arm64
      MemorySize: 512
      Timeout: 60
      Tracing: Active
      Environment:
        Variables:
          COST_OPTIMIZER_ENVIRONMENT: !Ref Environment
          COST_OPTIMIZER_SERVICE_NAME: ebs-scanner
          COST_OPTIMIZER_FINDINGS_TABLE_NAME: !Ref FindingsTable
          COST_OPTIMIZER_SCAN_RUNS_TABLE_NAME: !Ref ScanRunsTable
          COST_OPTIMIZER_SCAN_NOTIFICATIONS_TOPIC_ARN: !Ref ScanNotificationsTopic
      Policies:
        - Statement:
            - Sid: DescribeEbsVolumes
              Effect: Allow
              Action:
                - ec2:DescribeVolumes
              Resource: "*"
            - Sid: PersistFindings
              Effect: Allow
              Action:
                - dynamodb:UpdateItem
              Resource: !GetAtt FindingsTable.Arn
            - Sid: PersistScanRuns
              Effect: Allow
              Action:
                - dynamodb:PutItem
                - dynamodb:UpdateItem
              Resource: !GetAtt ScanRunsTable.Arn
            - Sid: PublishFindingNotifications
              Effect: Allow
              Action:
                - sns:Publish
              Resource: !Ref ScanNotificationsTopic

  EbsScannerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${EbsScannerFunction}"
      RetentionInDays: 30

  ElasticIpScannerFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      FunctionName: !Sub "aws-cost-optimizer-elastic-ip-scanner-${Environment}"
      CodeUri: ../backend/
      Handler: cost_optimization.workers.elastic_ip_scanner.handler
      Runtime: python3.13
      Architectures:
        - arm64
      MemorySize: 512
      Timeout: 60
      Tracing: Active
      Environment:
        Variables:
          COST_OPTIMIZER_ENVIRONMENT: !Ref Environment
          COST_OPTIMIZER_SERVICE_NAME: elastic-ip-scanner
          COST_OPTIMIZER_FINDINGS_TABLE_NAME: !Ref FindingsTable
          COST_OPTIMIZER_SCAN_RUNS_TABLE_NAME: !Ref ScanRunsTable
          COST_OPTIMIZER_SCAN_NOTIFICATIONS_TOPIC_ARN: !Ref ScanNotificationsTopic
      Policies:
        - Statement:
            - Sid: DescribeElasticIps
              Effect: Allow
              Action:
                - ec2:DescribeAddresses
              Resource: "*"
            - Sid: PersistFindings
              Effect: Allow
              Action:
                - dynamodb:UpdateItem
              Resource: !GetAtt FindingsTable.Arn
            - Sid: PersistScanRuns
              Effect: Allow
              Action:
                - dynamodb:PutItem
                - dynamodb:UpdateItem
              Resource: !GetAtt ScanRunsTable.Arn
            - Sid: PublishFindingNotifications
              Effect: Allow
              Action:
                - sns:Publish
              Resource: !Ref ScanNotificationsTopic

  ElasticIpScannerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ElasticIpScannerFunction}"
      RetentionInDays: 30

  EbsSnapshotScannerFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      FunctionName: !Sub "aws-cost-optimizer-ebs-snapshot-scanner-${Environment}"
      CodeUri: ../backend/
      Handler: cost_optimization.workers.ebs_snapshot_scanner.handler
      Runtime: python3.13
      Architectures:
        - arm64
      MemorySize: 512
      Timeout: 60
      Tracing: Active
      Environment:
        Variables:
          COST_OPTIMIZER_ENVIRONMENT: !Ref Environment
          COST_OPTIMIZER_SERVICE_NAME: ebs-snapshot-scanner
          COST_OPTIMIZER_FINDINGS_TABLE_NAME: !Ref FindingsTable
          COST_OPTIMIZER_SCAN_RUNS_TABLE_NAME: !Ref ScanRunsTable
          COST_OPTIMIZER_SCAN_NOTIFICATIONS_TOPIC_ARN: !Ref ScanNotificationsTopic
      Policies:
        - Statement:
            - Sid: DescribeOwnedEbsSnapshots
              Effect: Allow
              Action:
                - ec2:DescribeSnapshots
              Resource: "*"
            - Sid: PersistFindings
              Effect: Allow
              Action:
                - dynamodb:UpdateItem
              Resource: !GetAtt FindingsTable.Arn
            - Sid: PersistScanRuns
              Effect: Allow
              Action:
                - dynamodb:PutItem
                - dynamodb:UpdateItem
              Resource: !GetAtt ScanRunsTable.Arn
            - Sid: PublishFindingNotifications
              Effect: Allow
              Action:
                - sns:Publish
              Resource: !Ref ScanNotificationsTopic

  EbsSnapshotScannerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${EbsSnapshotScannerFunction}"
      RetentionInDays: 30

  Ec2UtilizationScannerFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      FunctionName: !Sub "aws-cost-optimizer-ec2-utilization-scanner-${Environment}"
      CodeUri: ../backend/
      Handler: cost_optimization.workers.ec2_utilization_scanner.handler
      Runtime: python3.13
      Architectures:
        - arm64
      MemorySize: 1024
      Timeout: 120
      Tracing: Active
      Environment:
        Variables:
          COST_OPTIMIZER_ENVIRONMENT: !Ref Environment
          COST_OPTIMIZER_SERVICE_NAME: ec2-utilization-scanner
          COST_OPTIMIZER_FINDINGS_TABLE_NAME: !Ref FindingsTable
          COST_OPTIMIZER_SCAN_RUNS_TABLE_NAME: !Ref ScanRunsTable
          COST_OPTIMIZER_SCAN_NOTIFICATIONS_TOPIC_ARN: !Ref ScanNotificationsTopic
          COST_OPTIMIZER_UTILIZATION_LOOKBACK_DAYS: !Ref UtilizationLookbackDays
          COST_OPTIMIZER_EC2_MAXIMUM_CPU_PERCENT: !Ref Ec2MaximumCpuPercent
          COST_OPTIMIZER_EC2_MAXIMUM_TOTAL_NETWORK_BYTES: !Ref Ec2MaximumTotalNetworkBytes
      Policies:
        - Statement:
            - Sid: DescribeRunningEc2Instances
              Effect: Allow
              Action:
                - ec2:DescribeInstances
              Resource: "*"
            - Sid: ReadEc2UtilizationMetrics
              Effect: Allow
              Action:
                - cloudwatch:GetMetricData
              Resource: "*"
            - Sid: PersistFindings
              Effect: Allow
              Action:
                - dynamodb:UpdateItem
              Resource: !GetAtt FindingsTable.Arn
            - Sid: PersistScanRuns
              Effect: Allow
              Action:
                - dynamodb:PutItem
                - dynamodb:UpdateItem
              Resource: !GetAtt ScanRunsTable.Arn
            - Sid: PublishFindingNotifications
              Effect: Allow
              Action:
                - sns:Publish
              Resource: !Ref ScanNotificationsTopic

  Ec2UtilizationScannerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${Ec2UtilizationScannerFunction}"
      RetentionInDays: 30

  RdsUtilizationScannerFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      FunctionName: !Sub "aws-cost-optimizer-rds-utilization-scanner-${Environment}"
      CodeUri: ../backend/
      Handler: cost_optimization.workers.rds_utilization_scanner.handler
      Runtime: python3.13
      Architectures:
        - arm64
      MemorySize: 1024
      Timeout: 120
      Tracing: Active
      Environment:
        Variables:
          COST_OPTIMIZER_ENVIRONMENT: !Ref Environment
          COST_OPTIMIZER_SERVICE_NAME: rds-utilization-scanner
          COST_OPTIMIZER_FINDINGS_TABLE_NAME: !Ref FindingsTable
          COST_OPTIMIZER_SCAN_RUNS_TABLE_NAME: !Ref ScanRunsTable
          COST_OPTIMIZER_SCAN_NOTIFICATIONS_TOPIC_ARN: !Ref ScanNotificationsTopic
          COST_OPTIMIZER_UTILIZATION_LOOKBACK_DAYS: !Ref UtilizationLookbackDays
          COST_OPTIMIZER_RDS_MAXIMUM_CPU_PERCENT: !Ref RdsMaximumCpuPercent
      Policies:
        - Statement:
            - Sid: DescribeAvailableRdsInstances
              Effect: Allow
              Action:
                - rds:DescribeDBInstances
                - rds:ListTagsForResource
              Resource: "*"
            - Sid: ReadRdsUtilizationMetrics
              Effect: Allow
              Action:
                - cloudwatch:GetMetricData
              Resource: "*"
            - Sid: PersistFindings
              Effect: Allow
              Action:
                - dynamodb:UpdateItem
              Resource: !GetAtt FindingsTable.Arn
            - Sid: PersistScanRuns
              Effect: Allow
              Action:
                - dynamodb:PutItem
                - dynamodb:UpdateItem
              Resource: !GetAtt ScanRunsTable.Arn
            - Sid: PublishFindingNotifications
              Effect: Allow
              Action:
                - sns:Publish
              Resource: !Ref ScanNotificationsTopic

  RdsUtilizationScannerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${RdsUtilizationScannerFunction}"
      RetentionInDays: 30

  ApplicationLoadBalancerScannerFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      FunctionName: !Sub "aws-cost-optimizer-alb-scanner-${Environment}"
      CodeUri: ../backend/
      Handler: cost_optimization.workers.application_load_balancer_scanner.handler
      Runtime: python3.13
      Architectures:
        - arm64
      MemorySize: 1024
      Timeout: 120
      Tracing: Active
      Environment:
        Variables:
          COST_OPTIMIZER_ENVIRONMENT: !Ref Environment
          COST_OPTIMIZER_SERVICE_NAME: application-load-balancer-scanner
          COST_OPTIMIZER_FINDINGS_TABLE_NAME: !Ref FindingsTable
          COST_OPTIMIZER_SCAN_RUNS_TABLE_NAME: !Ref ScanRunsTable
          COST_OPTIMIZER_SCAN_NOTIFICATIONS_TOPIC_ARN: !Ref ScanNotificationsTopic
          COST_OPTIMIZER_UTILIZATION_LOOKBACK_DAYS: !Ref UtilizationLookbackDays
      Policies:
        - Statement:
            - Sid: DescribeApplicationLoadBalancers
              Effect: Allow
              Action:
                - elasticloadbalancing:DescribeLoadBalancers
                - elasticloadbalancing:DescribeTags
              Resource: "*"
            - Sid: ReadApplicationLoadBalancerMetrics
              Effect: Allow
              Action:
                - cloudwatch:GetMetricData
              Resource: "*"
            - Sid: PersistFindings
              Effect: Allow
              Action:
                - dynamodb:UpdateItem
              Resource: !GetAtt FindingsTable.Arn
            - Sid: PersistScanRuns
              Effect: Allow
              Action:
                - dynamodb:PutItem
                - dynamodb:UpdateItem
              Resource: !GetAtt ScanRunsTable.Arn
            - Sid: PublishFindingNotifications
              Effect: Allow
              Action:
                - sns:Publish
              Resource: !Ref ScanNotificationsTopic

  ApplicationLoadBalancerScannerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ApplicationLoadBalancerScannerFunction}"
      RetentionInDays: 30

  EbsCleanupFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      FunctionName: !Sub "aws-cost-optimizer-ebs-cleanup-${Environment}"
      CodeUri: ../backend/
      Handler: cost_optimization.workers.ebs_cleanup.handler
      Runtime: python3.13
      Architectures:
        - arm64
      MemorySize: 512
      Timeout: 60
      Tracing: Active
      Environment:
        Variables:
          COST_OPTIMIZER_ENVIRONMENT: !Ref Environment
          COST_OPTIMIZER_SERVICE_NAME: ebs-cleanup
          COST_OPTIMIZER_FINDINGS_TABLE_NAME: !Ref FindingsTable
          COST_OPTIMIZER_AUDIT_EVENTS_TABLE_NAME: !Ref AuditEventsTable
          COST_OPTIMIZER_CLEANUP_DRY_RUN: !Ref CleanupDryRun
          COST_OPTIMIZER_CLEANUP_EXECUTION_ENABLED: !Ref CleanupExecutionEnabled
      Policies:
        - Statement:
            - Sid: ReadAndTransitionFindings
              Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:UpdateItem
              Resource: !GetAtt FindingsTable.Arn
            - Sid: WriteAtomicFindingAuditTransitions
              Effect: Allow
              Action:
                - dynamodb:TransactWriteItems
              Resource:
                - !GetAtt FindingsTable.Arn
                - !GetAtt AuditEventsTable.Arn
            - Sid: DescribeEbsVolumesForRevalidation
              Effect: Allow
              Action:
                - ec2:DescribeVolumes
              Resource: "*"
            - Sid: DeleteOnlyEbsVolumesInThisAccountAndRegion
              Effect: Allow
              Action:
                - ec2:DeleteVolume
              Resource: !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:volume/*"

  EbsCleanupLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${EbsCleanupFunction}"
      RetentionInDays: 30

  CleanupRequestRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "aws-cost-optimizer-cleanup-request-${Environment}"
      Description: !Sub "Routes explicit cleanup requests to the isolated EBS cleanup worker for ${Environment}."
      EventPattern:
        source:
          - aws-cost-optimizer.cleanup
        detail-type:
          - CleanupRequested
      State: ENABLED
      Targets:
        - Id: EbsCleanup
          Arn: !GetAtt EbsCleanupFunction.Arn
          RetryPolicy:
            MaximumEventAgeInSeconds: 3600
            MaximumRetryAttempts: 3
          DeadLetterConfig:
            Arn: !GetAtt CleanupRequestDeadLetterQueue.Arn

  CleanupRequestDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "aws-cost-optimizer-cleanup-request-dlq-${Environment}"
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true

  CleanupRequestDeadLetterQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref CleanupRequestDeadLetterQueue
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowEventBridgeToWriteFailedCleanupRequests
            Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt CleanupRequestDeadLetterQueue.Arn
            Condition:
              ArnEquals:
                aws:SourceArn: !GetAtt CleanupRequestRule.Arn

  AllowEventBridgeToInvokeEbsCleanup:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref EbsCleanupFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt CleanupRequestRule.Arn

  ScanNotificationsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub "aws-cost-optimizer-scan-notifications-${Environment}"

  NotificationEmailSubscription:
    Type: AWS::SNS::Subscription
    Condition: NotificationEmailConfigured
    Properties:
      Protocol: email
      Endpoint: !Ref NotificationEmail
      TopicArn: !Ref ScanNotificationsTopic

  OperationalAlertsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub "aws-cost-optimizer-operational-alerts-${Environment}"

  OperationalAlertEmailSubscription:
    Type: AWS::SNS::Subscription
    Condition: OperationalAlertEmailConfigured
    Properties:
      Protocol: email
      Endpoint: !Ref OperationalAlertEmail
      TopicArn: !Ref OperationalAlertsTopic

  ScannerFunctionErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "aws-cost-optimizer-scanner-errors-${Environment}"
      AlarmDescription: Any read-only scanner Lambda returned an error in the last five minutes.
      ComparisonOperator: GreaterThanThreshold
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 0
      TreatMissingData: notBreaching
      Metrics:
        - Id: ebs
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/Lambda
              MetricName: Errors
              Dimensions:
                - Name: FunctionName
                  Value: !Ref EbsScannerFunction
            Period: 300
            Stat: Sum
        - Id: elasticip
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/Lambda
              MetricName: Errors
              Dimensions:
                - Name: FunctionName
                  Value: !Ref ElasticIpScannerFunction
            Period: 300
            Stat: Sum
        - Id: snapshot
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/Lambda
              MetricName: Errors
              Dimensions:
                - Name: FunctionName
                  Value: !Ref EbsSnapshotScannerFunction
            Period: 300
            Stat: Sum
        - Id: ec2utilization
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/Lambda
              MetricName: Errors
              Dimensions:
                - Name: FunctionName
                  Value: !Ref Ec2UtilizationScannerFunction
            Period: 300
            Stat: Sum
        - Id: rdsutilization
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/Lambda
              MetricName: Errors
              Dimensions:
                - Name: FunctionName
                  Value: !Ref RdsUtilizationScannerFunction
            Period: 300
            Stat: Sum
        - Id: albutilization
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/Lambda
              MetricName: Errors
              Dimensions:
                - Name: FunctionName
                  Value: !Ref ApplicationLoadBalancerScannerFunction
            Period: 300
            Stat: Sum
        - Id: totalerrors
          Label: Scanner errors
          Expression: SUM([ebs,elasticip,snapshot,ec2utilization,rdsutilization,albutilization])
          ReturnData: true
      AlarmActions:
        - !Ref OperationalAlertsTopic

  CriticalWorkflowErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "aws-cost-optimizer-critical-workflow-errors-${Environment}"
      AlarmDescription: The authenticated API or isolated EBS cleanup Lambda returned an error in the last five minutes.
      ComparisonOperator: GreaterThanThreshold
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 0
      TreatMissingData: notBreaching
      Metrics:
        - Id: api
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/Lambda
              MetricName: Errors
              Dimensions:
                - Name: FunctionName
                  Value: !Ref ApiFunction
            Period: 300
            Stat: Sum
        - Id: cleanup
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/Lambda
              MetricName: Errors
              Dimensions:
                - Name: FunctionName
                  Value: !Ref EbsCleanupFunction
            Period: 300
            Stat: Sum
        - Id: totalerrors
          Label: Critical workflow errors
          Expression: SUM([api,cleanup])
          ReturnData: true
      AlarmActions:
        - !Ref OperationalAlertsTopic

  ApiGatewayServerErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "aws-cost-optimizer-api-5xx-${Environment}"
      AlarmDescription: API Gateway returned a 5xx response in the last five minutes.
      Namespace: AWS/ApiGateway
      MetricName: 5xx
      Dimensions:
        - Name: ApiId
          Value: !Ref CostOptimizationHttpApi
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      ComparisonOperator: GreaterThanThreshold
      Threshold: 0
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref OperationalAlertsTopic

  DeadLetterQueueMessageAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "aws-cost-optimizer-dlq-messages-${Environment}"
      AlarmDescription: A failed EventBridge invocation is waiting for investigation in a dead-letter queue.
      ComparisonOperator: GreaterThanThreshold
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 0
      TreatMissingData: notBreaching
      Metrics:
        - Id: scheduled
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/SQS
              MetricName: ApproximateNumberOfMessagesVisible
              Dimensions:
                - Name: QueueName
                  Value: !GetAtt ScheduledScanDeadLetterQueue.QueueName
            Period: 300
            Stat: Maximum
        - Id: cleanup
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/SQS
              MetricName: ApproximateNumberOfMessagesVisible
              Dimensions:
                - Name: QueueName
                  Value: !GetAtt CleanupRequestDeadLetterQueue.QueueName
            Period: 300
            Stat: Maximum
        - Id: totalmessages
          Label: Visible DLQ messages
          Expression: SUM([scheduled,cleanup])
          ReturnData: true
      AlarmActions:
        - !Ref OperationalAlertsTopic

  OperationalDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub "aws-cost-optimizer-${Environment}"
      DashboardBody: !Sub |
        {
          "widgets": [
            {
              "type": "metric",
              "x": 0,
              "y": 0,
              "width": 12,
              "height": 6,
              "properties": {
                "title": "Lambda errors",
                "view": "timeSeries",
                "region": "${AWS::Region}",
                "stat": "Sum",
                "period": 300,
                "metrics": [
                  [ "AWS/Lambda", "Errors", "FunctionName", "${EbsScannerFunction}" ],
                  [ ".", ".", ".", "${ElasticIpScannerFunction}" ],
                  [ ".", ".", ".", "${EbsSnapshotScannerFunction}" ],
                  [ ".", ".", ".", "${Ec2UtilizationScannerFunction}" ],
                  [ ".", ".", ".", "${RdsUtilizationScannerFunction}" ],
                  [ ".", ".", ".", "${ApplicationLoadBalancerScannerFunction}" ],
                  [ ".", ".", ".", "${ApiFunction}" ],
                  [ ".", ".", ".", "${EbsCleanupFunction}" ]
                ]
              }
            },
            {
              "type": "metric",
              "x": 12,
              "y": 0,
              "width": 12,
              "height": 6,
              "properties": {
                "title": "Scanner outcomes",
                "view": "timeSeries",
                "region": "${AWS::Region}",
                "stat": "Sum",
                "period": 300,
                "metrics": [
                  [ { "expression": "SEARCH('{AwsCostOptimizer,Environment,ScannerName} MetricName=\\\"CompletedScans\\\" Environment=\\\"${Environment}\\\"', 'Sum', 300)", "id": "completed", "label": "Completed scans" } ],
                  [ { "expression": "SEARCH('{AwsCostOptimizer,Environment,ScannerName} MetricName=\\\"FailedScans\\\" Environment=\\\"${Environment}\\\"', 'Sum', 300)", "id": "failed", "label": "Failed scans" } ],
                  [ { "expression": "SEARCH('{AwsCostOptimizer,Environment,ScannerName} MetricName=\\\"FindingsDetected\\\" Environment=\\\"${Environment}\\\"', 'Sum', 300)", "id": "findings", "label": "Findings detected" } ]
                ]
              }
            },
            {
              "type": "metric",
              "x": 0,
              "y": 6,
              "width": 12,
              "height": 6,
              "properties": {
                "title": "Dead-letter queue messages",
                "view": "timeSeries",
                "region": "${AWS::Region}",
                "stat": "Maximum",
                "period": 300,
                "metrics": [
                  [ "AWS/SQS", "ApproximateNumberOfMessagesVisible", "QueueName", "${ScheduledScanDeadLetterQueue.QueueName}" ],
                  [ ".", ".", ".", "${CleanupRequestDeadLetterQueue.QueueName}" ]
                ]
              }
            },
            {
              "type": "metric",
              "x": 12,
              "y": 6,
              "width": 12,
              "height": 6,
              "properties": {
                "title": "API Gateway responses",
                "view": "timeSeries",
                "region": "${AWS::Region}",
                "stat": "Sum",
                "period": 300,
                "metrics": [
                  [ "AWS/ApiGateway", "4xx", "ApiId", "${CostOptimizationHttpApi}" ],
                  [ ".", "5xx", ".", "." ]
                ]
              }
            }
          ]
        }

  ScheduledScanDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "aws-cost-optimizer-scheduled-scan-dlq-${Environment}"
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true

  ScheduledScanDeadLetterQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref ScheduledScanDeadLetterQueue
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowInventoryScheduleToWriteFailedScans
            Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt ScheduledScanDeadLetterQueue.Arn
            Condition:
              ArnEquals:
                aws:SourceArn: !GetAtt ScheduledEbsScanRule.Arn
          - Sid: AllowUtilizationScheduleToWriteFailedScans
            Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt ScheduledScanDeadLetterQueue.Arn
            Condition:
              ArnEquals:
                aws:SourceArn: !GetAtt ScheduledUtilizationScanRule.Arn

  ScheduledEbsScanRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "aws-cost-optimizer-inventory-scan-${Environment}"
      Description: !Sub "Runs read-only inventory cost-optimization scans for ${Environment}."
      ScheduleExpression: !Ref ScanScheduleExpression
      State: !If [ScheduledScansEnabledCondition, ENABLED, DISABLED]
      Targets:
        - Id: EbsScanner
          Arn: !GetAtt EbsScannerFunction.Arn
          Input: !Sub '{"trigger":"scheduled","environment":"${Environment}"}'
          RetryPolicy:
            MaximumEventAgeInSeconds: 3600
            MaximumRetryAttempts: 3
          DeadLetterConfig:
            Arn: !GetAtt ScheduledScanDeadLetterQueue.Arn
        - Id: ElasticIpScanner
          Arn: !GetAtt ElasticIpScannerFunction.Arn
          Input: !Sub '{"trigger":"scheduled","environment":"${Environment}"}'
          RetryPolicy:
            MaximumEventAgeInSeconds: 3600
            MaximumRetryAttempts: 3
          DeadLetterConfig:
            Arn: !GetAtt ScheduledScanDeadLetterQueue.Arn
        - Id: EbsSnapshotScanner
          Arn: !GetAtt EbsSnapshotScannerFunction.Arn
          Input: !Sub '{"trigger":"scheduled","environment":"${Environment}"}'
          RetryPolicy:
            MaximumEventAgeInSeconds: 3600
            MaximumRetryAttempts: 3
          DeadLetterConfig:
            Arn: !GetAtt ScheduledScanDeadLetterQueue.Arn
  ScheduledUtilizationScanRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "aws-cost-optimizer-utilization-scan-${Environment}"
      Description: !Sub "Runs read-only utilization recommendation scans for ${Environment}."
      ScheduleExpression: !Ref ScanScheduleExpression
      State: !If [ScheduledScansEnabledCondition, ENABLED, DISABLED]
      Targets:
        - Id: Ec2UtilizationScanner
          Arn: !GetAtt Ec2UtilizationScannerFunction.Arn
          Input: !Sub '{"trigger":"scheduled","environment":"${Environment}"}'
          RetryPolicy:
            MaximumEventAgeInSeconds: 3600
            MaximumRetryAttempts: 3
          DeadLetterConfig:
            Arn: !GetAtt ScheduledScanDeadLetterQueue.Arn
        - Id: RdsUtilizationScanner
          Arn: !GetAtt RdsUtilizationScannerFunction.Arn
          Input: !Sub '{"trigger":"scheduled","environment":"${Environment}"}'
          RetryPolicy:
            MaximumEventAgeInSeconds: 3600
            MaximumRetryAttempts: 3
          DeadLetterConfig:
            Arn: !GetAtt ScheduledScanDeadLetterQueue.Arn
        - Id: ApplicationLoadBalancerScanner
          Arn: !GetAtt ApplicationLoadBalancerScannerFunction.Arn
          Input: !Sub '{"trigger":"scheduled","environment":"${Environment}"}'
          RetryPolicy:
            MaximumEventAgeInSeconds: 3600
            MaximumRetryAttempts: 3
          DeadLetterConfig:
            Arn: !GetAtt ScheduledScanDeadLetterQueue.Arn

  AllowEventBridgeToInvokeEbsScanner:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref EbsScannerFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt ScheduledEbsScanRule.Arn

  AllowEventBridgeToInvokeElasticIpScanner:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref ElasticIpScannerFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt ScheduledEbsScanRule.Arn

  AllowEventBridgeToInvokeEbsSnapshotScanner:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref EbsSnapshotScannerFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt ScheduledEbsScanRule.Arn

  AllowEventBridgeToInvokeEc2UtilizationScanner:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref Ec2UtilizationScannerFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt ScheduledUtilizationScanRule.Arn

  AllowEventBridgeToInvokeRdsUtilizationScanner:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref RdsUtilizationScannerFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt ScheduledUtilizationScanRule.Arn

  AllowEventBridgeToInvokeApplicationLoadBalancerScanner:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref ApplicationLoadBalancerScannerFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt ScheduledUtilizationScanRule.Arn

Outputs:
  DashboardUrl:
    Description: Configured HTTPS Vercel production origin for the operator dashboard.
    Value: !Ref DashboardOrigin
  OperationalDashboardName:
    Description: CloudWatch dashboard for scanner, workflow, queue, and API health.
    Value: !Ref OperationalDashboard
  OperationalAlertsTopicArn:
    Description: SNS topic used for operational alarm notifications.
    Value: !Ref OperationalAlertsTopic
  ApiEndpoint:
    Description: JWT-protected API Gateway endpoint for operational API requests.
    Value: !Sub "https://${CostOptimizationHttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}"
  ApiUserPoolId:
    Description: Cognito user pool containing approved API operators.
    Value: !Ref ApiUserPool
  CognitoIssuer:
    Description: Public Cognito issuer URL used by the dashboard OIDC client.
    Value: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${ApiUserPool}"
  CognitoDomain:
    Description: Cognito managed-login domain used by the dashboard OIDC client.
    Value: !Sub "https://${ApiUserPoolDomain}.auth.${AWS::Region}.amazoncognito.com"
  DashboardCognitoClientId:
    Description: Public Cognito app-client ID used by the dashboard OIDC client.
    Value: !Ref ApiUserPoolClient
  ApiUserPoolClientId:
    Description: Cognito app-client ID used as the API Gateway JWT audience.
    Value: !Ref ApiUserPoolClient
  EbsScannerFunctionName:
    Description: Lambda function name for manual scan invocation.
    Value: !Ref EbsScannerFunction
  ElasticIpScannerFunctionName:
    Description: Lambda function name for manual Elastic IP scan invocation.
    Value: !Ref ElasticIpScannerFunction
  EbsSnapshotScannerFunctionName:
    Description: Lambda function name for manual EBS snapshot scan invocation.
    Value: !Ref EbsSnapshotScannerFunction
  Ec2UtilizationScannerFunctionName:
    Description: Lambda function name for manual EC2 utilization scan invocation.
    Value: !Ref Ec2UtilizationScannerFunction
  RdsUtilizationScannerFunctionName:
    Description: Lambda function name for manual RDS utilization scan invocation.
    Value: !Ref RdsUtilizationScannerFunction
  ApplicationLoadBalancerScannerFunctionName:
    Description: Lambda function name for manual Application Load Balancer traffic scan invocation.
    Value: !Ref ApplicationLoadBalancerScannerFunction
  EbsCleanupFunctionName:
    Description: Isolated Lambda that dry-runs or cleans one approved EBS finding.
    Value: !Ref EbsCleanupFunction
  CleanupRequestDeadLetterQueueUrl:
    Description: SQS queue containing cleanup requests that exhausted EventBridge retries.
    Value: !Ref CleanupRequestDeadLetterQueue
  FindingsTableName:
    Description: DynamoDB table that stores deduplicated findings.
    Value: !Ref FindingsTable
  ScanRunsTableName:
    Description: DynamoDB table that stores scan execution records.
    Value: !Ref ScanRunsTable
  AuditEventsTableName:
    Description: DynamoDB table containing append-only finding lifecycle audit events.
    Value: !Ref AuditEventsTable
  ScanNotificationsTopicArn:
    Description: SNS topic used for finding notifications.
    Value: !Ref ScanNotificationsTopic
  ScheduledScanDeadLetterQueueUrl:
    Description: SQS queue containing scheduled events that exhausted EventBridge retries.
    Value: !Ref ScheduledScanDeadLetterQueue
