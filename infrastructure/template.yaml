AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Deployable foundation for the AWS Cost Optimization Automation System.

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - staging
      - prod
    Description: Deployment environment name.
  ScheduledScansEnabled:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: Enable the EventBridge schedule for automatic EBS scans.
  ScanScheduleExpression:
    Type: String
    Default: "cron(0 3 ? * SUN *)"
    Description: EventBridge schedule expression for automatic EBS scans (UTC).
  NotificationEmail:
    Type: String
    Default: ""
    Description: Optional email address for SNS finding notifications. The recipient must confirm the subscription.
  CleanupDryRun:
    Type: String
    Default: "true"
    AllowedValues:
      - "true"
      - "false"
    Description: Keep cleanup simulation-only unless deliberately disabled with cleanup execution enabled.
  CleanupExecutionEnabled:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: Explicitly allow the isolated cleanup Lambda to delete revalidated EBS volumes.

Conditions:
  ScheduledScansEnabledCondition: !Equals [!Ref ScheduledScansEnabled, "true"]
  NotificationEmailConfigured: !Not [!Equals [!Ref NotificationEmail, ""]]

Resources:
  FindingsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "aws-cost-optimizer-findings-${Environment}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: finding_id
          AttributeType: S
      KeySchema:
        - AttributeName: finding_id
          KeyType: HASH
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true

  ScanRunsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "aws-cost-optimizer-scan-runs-${Environment}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: scan_id
          AttributeType: S
      KeySchema:
        - AttributeName: scan_id
          KeyType: HASH
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true

  AuditEventsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "aws-cost-optimizer-audit-events-${Environment}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: finding_id
          AttributeType: S
        - AttributeName: event_id
          AttributeType: S
      KeySchema:
        - AttributeName: finding_id
          KeyType: HASH
        - AttributeName: event_id
          KeyType: RANGE
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true

  EbsScannerFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      FunctionName: !Sub "aws-cost-optimizer-ebs-scanner-${Environment}"
      CodeUri: ../backend/
      Handler: cost_optimization.workers.ebs_scanner.handler
      Runtime: python3.13
      Architectures:
        - arm64
      MemorySize: 512
      Timeout: 60
      Tracing: Active
      Environment:
        Variables:
          COST_OPTIMIZER_ENVIRONMENT: !Ref Environment
          COST_OPTIMIZER_SERVICE_NAME: ebs-scanner
          COST_OPTIMIZER_FINDINGS_TABLE_NAME: !Ref FindingsTable
          COST_OPTIMIZER_SCAN_RUNS_TABLE_NAME: !Ref ScanRunsTable
          COST_OPTIMIZER_SCAN_NOTIFICATIONS_TOPIC_ARN: !Ref ScanNotificationsTopic
      Policies:
        - Statement:
            - Sid: DescribeEbsVolumes
              Effect: Allow
              Action:
                - ec2:DescribeVolumes
              Resource: "*"
            - Sid: PersistFindings
              Effect: Allow
              Action:
                - dynamodb:UpdateItem
              Resource: !GetAtt FindingsTable.Arn
            - Sid: PersistScanRuns
              Effect: Allow
              Action:
                - dynamodb:PutItem
                - dynamodb:UpdateItem
              Resource: !GetAtt ScanRunsTable.Arn
            - Sid: PublishFindingNotifications
              Effect: Allow
              Action:
                - sns:Publish
              Resource: !Ref ScanNotificationsTopic

  EbsScannerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${EbsScannerFunction}"
      RetentionInDays: 30

  ElasticIpScannerFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      FunctionName: !Sub "aws-cost-optimizer-elastic-ip-scanner-${Environment}"
      CodeUri: ../backend/
      Handler: cost_optimization.workers.elastic_ip_scanner.handler
      Runtime: python3.13
      Architectures:
        - arm64
      MemorySize: 512
      Timeout: 60
      Tracing: Active
      Environment:
        Variables:
          COST_OPTIMIZER_ENVIRONMENT: !Ref Environment
          COST_OPTIMIZER_SERVICE_NAME: elastic-ip-scanner
          COST_OPTIMIZER_FINDINGS_TABLE_NAME: !Ref FindingsTable
          COST_OPTIMIZER_SCAN_RUNS_TABLE_NAME: !Ref ScanRunsTable
          COST_OPTIMIZER_SCAN_NOTIFICATIONS_TOPIC_ARN: !Ref ScanNotificationsTopic
      Policies:
        - Statement:
            - Sid: DescribeElasticIps
              Effect: Allow
              Action:
                - ec2:DescribeAddresses
              Resource: "*"
            - Sid: PersistFindings
              Effect: Allow
              Action:
                - dynamodb:UpdateItem
              Resource: !GetAtt FindingsTable.Arn
            - Sid: PersistScanRuns
              Effect: Allow
              Action:
                - dynamodb:PutItem
                - dynamodb:UpdateItem
              Resource: !GetAtt ScanRunsTable.Arn
            - Sid: PublishFindingNotifications
              Effect: Allow
              Action:
                - sns:Publish
              Resource: !Ref ScanNotificationsTopic

  ElasticIpScannerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ElasticIpScannerFunction}"
      RetentionInDays: 30

  EbsSnapshotScannerFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      FunctionName: !Sub "aws-cost-optimizer-ebs-snapshot-scanner-${Environment}"
      CodeUri: ../backend/
      Handler: cost_optimization.workers.ebs_snapshot_scanner.handler
      Runtime: python3.13
      Architectures:
        - arm64
      MemorySize: 512
      Timeout: 60
      Tracing: Active
      Environment:
        Variables:
          COST_OPTIMIZER_ENVIRONMENT: !Ref Environment
          COST_OPTIMIZER_SERVICE_NAME: ebs-snapshot-scanner
          COST_OPTIMIZER_FINDINGS_TABLE_NAME: !Ref FindingsTable
          COST_OPTIMIZER_SCAN_RUNS_TABLE_NAME: !Ref ScanRunsTable
          COST_OPTIMIZER_SCAN_NOTIFICATIONS_TOPIC_ARN: !Ref ScanNotificationsTopic
      Policies:
        - Statement:
            - Sid: DescribeOwnedEbsSnapshots
              Effect: Allow
              Action:
                - ec2:DescribeSnapshots
              Resource: "*"
            - Sid: PersistFindings
              Effect: Allow
              Action:
                - dynamodb:UpdateItem
              Resource: !GetAtt FindingsTable.Arn
            - Sid: PersistScanRuns
              Effect: Allow
              Action:
                - dynamodb:PutItem
                - dynamodb:UpdateItem
              Resource: !GetAtt ScanRunsTable.Arn
            - Sid: PublishFindingNotifications
              Effect: Allow
              Action:
                - sns:Publish
              Resource: !Ref ScanNotificationsTopic

  EbsSnapshotScannerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${EbsSnapshotScannerFunction}"
      RetentionInDays: 30

  EbsCleanupFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      FunctionName: !Sub "aws-cost-optimizer-ebs-cleanup-${Environment}"
      CodeUri: ../backend/
      Handler: cost_optimization.workers.ebs_cleanup.handler
      Runtime: python3.13
      Architectures:
        - arm64
      MemorySize: 512
      Timeout: 60
      Tracing: Active
      Environment:
        Variables:
          COST_OPTIMIZER_ENVIRONMENT: !Ref Environment
          COST_OPTIMIZER_SERVICE_NAME: ebs-cleanup
          COST_OPTIMIZER_FINDINGS_TABLE_NAME: !Ref FindingsTable
          COST_OPTIMIZER_AUDIT_EVENTS_TABLE_NAME: !Ref AuditEventsTable
          COST_OPTIMIZER_CLEANUP_DRY_RUN: !Ref CleanupDryRun
          COST_OPTIMIZER_CLEANUP_EXECUTION_ENABLED: !Ref CleanupExecutionEnabled
      Policies:
        - Statement:
            - Sid: ReadAndTransitionFindings
              Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:UpdateItem
              Resource: !GetAtt FindingsTable.Arn
            - Sid: WriteAtomicFindingAuditTransitions
              Effect: Allow
              Action:
                - dynamodb:TransactWriteItems
              Resource:
                - !GetAtt FindingsTable.Arn
                - !GetAtt AuditEventsTable.Arn
            - Sid: DescribeEbsVolumesForRevalidation
              Effect: Allow
              Action:
                - ec2:DescribeVolumes
              Resource: "*"
            - Sid: DeleteOnlyEbsVolumesInThisAccountAndRegion
              Effect: Allow
              Action:
                - ec2:DeleteVolume
              Resource: !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:volume/*"

  EbsCleanupLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${EbsCleanupFunction}"
      RetentionInDays: 30

  CleanupRequestRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "aws-cost-optimizer-cleanup-request-${Environment}"
      Description: !Sub "Routes explicit cleanup requests to the isolated EBS cleanup worker for ${Environment}."
      EventPattern:
        source:
          - aws-cost-optimizer.cleanup
        detail-type:
          - CleanupRequested
      State: ENABLED
      Targets:
        - Id: EbsCleanup
          Arn: !GetAtt EbsCleanupFunction.Arn
          RetryPolicy:
            MaximumEventAgeInSeconds: 3600
            MaximumRetryAttempts: 3
          DeadLetterConfig:
            Arn: !GetAtt CleanupRequestDeadLetterQueue.Arn

  CleanupRequestDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "aws-cost-optimizer-cleanup-request-dlq-${Environment}"
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true

  CleanupRequestDeadLetterQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref CleanupRequestDeadLetterQueue
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowEventBridgeToWriteFailedCleanupRequests
            Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt CleanupRequestDeadLetterQueue.Arn
            Condition:
              ArnEquals:
                aws:SourceArn: !GetAtt CleanupRequestRule.Arn

  AllowEventBridgeToInvokeEbsCleanup:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref EbsCleanupFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt CleanupRequestRule.Arn

  ScanNotificationsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub "aws-cost-optimizer-scan-notifications-${Environment}"

  NotificationEmailSubscription:
    Type: AWS::SNS::Subscription
    Condition: NotificationEmailConfigured
    Properties:
      Protocol: email
      Endpoint: !Ref NotificationEmail
      TopicArn: !Ref ScanNotificationsTopic

  ScheduledScanDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "aws-cost-optimizer-scheduled-scan-dlq-${Environment}"
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true

  ScheduledScanDeadLetterQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref ScheduledScanDeadLetterQueue
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowEventBridgeToWriteFailedScheduledScans
            Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt ScheduledScanDeadLetterQueue.Arn
            Condition:
              ArnEquals:
                aws:SourceArn: !GetAtt ScheduledEbsScanRule.Arn

  ScheduledEbsScanRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "aws-cost-optimizer-ebs-scan-${Environment}"
      Description: !Sub "Runs the EBS cost-optimization scan for ${Environment}."
      ScheduleExpression: !Ref ScanScheduleExpression
      State: !If [ScheduledScansEnabledCondition, ENABLED, DISABLED]
      Targets:
        - Id: EbsScanner
          Arn: !GetAtt EbsScannerFunction.Arn
          Input: !Sub '{"trigger":"scheduled","environment":"${Environment}"}'
          RetryPolicy:
            MaximumEventAgeInSeconds: 3600
            MaximumRetryAttempts: 3
          DeadLetterConfig:
            Arn: !GetAtt ScheduledScanDeadLetterQueue.Arn

  AllowEventBridgeToInvokeEbsScanner:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref EbsScannerFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt ScheduledEbsScanRule.Arn

Outputs:
  EbsScannerFunctionName:
    Description: Lambda function name for manual scan invocation.
    Value: !Ref EbsScannerFunction
  ElasticIpScannerFunctionName:
    Description: Lambda function name for manual Elastic IP scan invocation.
    Value: !Ref ElasticIpScannerFunction
  EbsSnapshotScannerFunctionName:
    Description: Lambda function name for manual EBS snapshot scan invocation.
    Value: !Ref EbsSnapshotScannerFunction
  EbsCleanupFunctionName:
    Description: Isolated Lambda that dry-runs or cleans one approved EBS finding.
    Value: !Ref EbsCleanupFunction
  CleanupRequestDeadLetterQueueUrl:
    Description: SQS queue containing cleanup requests that exhausted EventBridge retries.
    Value: !Ref CleanupRequestDeadLetterQueue
  FindingsTableName:
    Description: DynamoDB table that stores deduplicated findings.
    Value: !Ref FindingsTable
  ScanRunsTableName:
    Description: DynamoDB table that stores scan execution records.
    Value: !Ref ScanRunsTable
  AuditEventsTableName:
    Description: DynamoDB table containing append-only finding lifecycle audit events.
    Value: !Ref AuditEventsTable
  ScanNotificationsTopicArn:
    Description: SNS topic used for finding notifications.
    Value: !Ref ScanNotificationsTopic
  ScheduledScanDeadLetterQueueUrl:
    Description: SQS queue containing scheduled events that exhausted EventBridge retries.
    Value: !Ref ScheduledScanDeadLetterQueue
